[package]
name = "kanryo-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
    "std",
    "serde",
] }
serde = { workspace = true, features = ["derive"] }
uuid = { version = "1.29.0", features = ["v7", "v5", "serde"] }

[target.wasm32-unknown-unknown.dependencies]
uuid = { version = "1.29.0", features = ["js"] }
